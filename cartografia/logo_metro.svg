<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="logo-titulo logo-desc">
  <title id="logo-titulo">Logotipo Oficial SIMMA — Metro y Movilidad de Asura</title>
  <desc id="logo-desc">Emblema octilineal del Sistema Integrado de Metro y Movilidad de Asura.</desc>
  <!-- Escudo arquitectónico SIMMA -->
  <rect x="12" y="12" width="216" height="216" rx="46" fill="#FFFFFF" stroke="#182026" stroke-width="8"/>
  <!-- Anillo orbital periférico (Línea A · 132,8 km) -->
