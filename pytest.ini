[pytest]
DJANGO_SETTINGS_MODULE = metrito_config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests network
addopts = --strict-markers -ra
markers =
    unit: Pruebas unitarias de modelos, funciones auxiliares y validaciones aisladas
    integration: Pruebas de integración de endpoints REST, transacciones y persistencia
